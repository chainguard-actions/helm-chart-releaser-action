name: Test explicit chart without Chart.yaml fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          charts: tests/fixtures/charts/notachart
          install_dir: ${{ runner.temp }}/cr-invalid
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CHANGED: ${{ steps.action.outputs.changed_charts }}
        run: |
          echo "outcome: $OUTCOME"
          echo "changed_charts: '$CHANGED'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for directory without Chart.yaml"
            exit 1
          fi
          if [ -n "$CHANGED" ]; then
            echo "FAIL: changed_charts should not be set"
            exit 1
          fi
          echo "PASS"
