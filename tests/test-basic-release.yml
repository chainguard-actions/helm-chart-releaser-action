name: Test basic release (sentinel repo graceful failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git and charts directory
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a minimal charts directory with a Chart.yaml
          mkdir -p charts/test-chart
          cat > charts/test-chart/Chart.yaml <<'EOF'
          apiVersion: v2
          name: test-chart
          version: 0.1.0
          description: A test chart
          EOF
          git add charts/
          git commit -m "Add test chart" || true

      - name: Set up RUNNER_TOOL_CACHE
        run: |
          mkdir -p "$RUNNER_TOOL_CACHE"

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: v1.7.0
          charts_dir: charts
          mark_as_latest: "true"
        env:
          CR_TOKEN: ${{ github.token }}

      - name: Assert action ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CHANGED_CHARTS: ${{ steps.action.outputs.changed_charts }}
        run: |
          echo "outcome: $OUTCOME"
          echo "changed_charts: $CHANGED_CHARTS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
