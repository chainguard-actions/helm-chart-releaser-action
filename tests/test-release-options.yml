name: Test release option inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
      CR_TOKEN: fake-token-for-install-only
      RUNNER_TOOL_CACHE: /tmp/runner-tool-cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create runner tool cache dir
        run: mkdir -p /tmp/runner-tool-cache
      - name: Create a dummy cr config file
        run: |
          mkdir -p /tmp/cr-config
          cat > /tmp/cr-config/cr.yaml <<'EOF'
          owner: test-owner
          repo: test-repo
          EOF
      - id: action
        uses: .
        with:
          version: v1.7.0
          install_only: "true"
          config: /tmp/cr-config/cr.yaml
          pages_branch: gh-pages
          skip_existing: "true"
          skip_packaging: "true"
          skip_upload: "true"
      - name: Assert cr is installed
        run: |
          if ! command -v cr &>/dev/null; then
            echo "FAIL: cr binary not found in PATH"
            exit 1
          fi
          echo "PASS: cr binary found, all release option inputs accepted"
