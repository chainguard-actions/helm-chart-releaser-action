name: Test install only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install_only: "true"
          install_dir: ${{ runner.temp }}/cr-install-only
      - name: Assert cr binary installed and on PATH
        env:
          INSTALL_DIR: ${{ runner.temp }}/cr-install-only
        run: |
          ls -la "$INSTALL_DIR" || true
          if [ ! -x "$INSTALL_DIR/cr" ]; then
            echo "FAIL: cr binary not found at $INSTALL_DIR/cr"
            exit 1
          fi
          if ! command -v cr >/dev/null 2>&1; then
            echo "FAIL: cr not on PATH (PATH=$PATH)"
            exit 1
          fi
          cr version || cr --help
          echo "PASS"
      - name: Assert no outputs set in install-only mode
        env:
          CHANGED: ${{ steps.action.outputs.changed_charts }}
        run: |
          echo "changed_charts: '$CHANGED'"
          if [ -n "$CHANGED" ]; then
            echo "FAIL: expected empty changed_charts"
            exit 1
          fi
          echo "PASS"
