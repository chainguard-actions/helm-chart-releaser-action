name: Test charts combined with skip_packaging fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          charts: tests/fixtures/charts/mychart
          skip_packaging: "true"
          install_dir: ${{ runner.temp }}/cr-skip-error
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when charts and skip_packaging are combined"
            exit 1
          fi
          if [ -d .cr-release-packages ]; then
            echo "FAIL: packaging should not have happened"
            exit 1
          fi
          echo "PASS"
